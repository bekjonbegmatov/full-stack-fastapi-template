services:

  proxy:
    restart: always
    ports:
      # Listen on port 80, default for HTTP, necessary to redirect to HTTPS
      - "80:80"
      # Listen on port 443, default for HTTPS
      - "443:443"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    environment:
      CADDY_SITE_ADDRESS: https://${DOMAIN:?Variable not set}

  db:
    restart: always

  adminer:
    restart: always

  backend:
    restart: always
    environment:
      FRONTEND_HOST: https://${DOMAIN:?Variable not set}

volumes:
  # Keep Caddy's account data and certificates across container recreations.
  caddy-data:
  caddy-config:
